<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Список дел</title>
</head>

<body>
    <h1>Список дел</h1>
    <a href="{% url 'task_create' %}">Добавить задачу</a>

    {% for task in tasks %}
    <div>
        <h3>{{ task.description }}</h3>
        <p>Статус: {{ task.get_status_display }}</p>
        <a href="{% url 'task_delete' task.id %}">Удалить</a>

        {% if task.due_date %}
        <p>Дата выполнения: {{ task.due_date }}</p>
        {% endif %}
    </div>
    {% empty %}
    <p>Пока задач нет.</p>
    {% endfor %}
</body>

</html>
